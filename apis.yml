name: Tierra Biosciences
description: 'Tierra Biosciences is a San Leandro, California synthetic biology company using AI-guided,
  cell-free protein production to synthesize custom proteins on demand for pharmaceutical, industrial,
  and agricultural research. Its customer-facing Tierra Protein Platform is a web-based eCommerce
  ordering portal where researchers enter protein sequences and get custom proteins synthesized,
  validated, and shipped. The company (rebranding toward Revr Bio) is backed by prosus-ventures and
  Material Impact. No public developer API, SDK, or programmatic-access surface is currently published;
  this profile was enriched and confirmed as a web-platform-only provider.'
